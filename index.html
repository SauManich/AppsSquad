<!DOCTYPE html>
<!-- https://github.com/ITowerEducation/elegant_notes/blob/main/index.html -->
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notapp's</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <div class="container">
      <header class="header">
        <h1>Notapp's</h1>
        <p>Notas rapidas</p>
      </header>

      <div class="controls">
        <div class="controls-container">
          <input
            type="text"
            id="searchInput"
            placeholder="Buscar nota..."
            class="search-input"
          />
          <div class="filter-group">
            <select id="filterSelect" class="filter-select">
              <option value="all">Todas</option>
              <option value="work">Trabajo</option>
              <option value="personal">Personal</option>
              <option value="ideas">Ideas</option>
              <option value="reminders">Recordatorios</option>
            </select>
            <button id="addNoteBtn" class="add-btn">
              <i class="fas fa-plus"></i> Agregar
            </button>
          </div>
        </div>
      </div>

      <div id="notesContainer" class="notes-grid">
        <!-- Notes will be added here dynamically -->
      </div>

      <div id="emptyState" class="empty-state">
        <i class="fas fa-notes-medical"></i>
        <h3>No hay Notapp's</h3>
        <p>Puedes agregar una nueva nota haciendo click en "Agregar"</p>
      </div>

      <div id="addNoteModal" class="modal-overlay">
        <div class="modal">
          <div class="modal-header">
            <h3 class="modal-title">Nueva Notapp's</h3>
            <button id="closeModalBtn" class="modal-close">
              <i class="fas fa-times"></i>
            </button>
          </div>

          <form id="noteForm" class="modal-body">
            <div class="form-group">
              <label for="noteTitle" class="form-label">Titulo</label>
              <input type="text" id="noteTitle" class="form-input" required />
            </div>
            <div class="form-group">
              <label for="noteContent" class="form-label"> Contenido </label>
              <textarea
                id="noteContent"
                class="form-input form-textarea"
                required
              ></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">Etiqueta</label>
              <div class="tags-container">
                <label class="tag-option">
                  <input
                    type="radio"
                    name="noteTag"
                    value="work"
                    class="tag-radio"
                  />
                  <span class="tag-label tag-work">
                    <i class="fas fa-briefcase"></i> Trabajo
                  </span>
                </label>
                <label class="tag-option">
                  <input
                    type="radio"
                    name="noteTag"
                    value="personal"
                    class="tag-radio"
                  />
                  <span class="tag-label tag-personal">
                    <i class="fas fa-user"></i> Personal
                  </span>
                </label>
                <label class="tag-option">
                  <input
                    type="radio"
                    name="noteTag"
                    value="ideas"
                    class="tag-radio"
                    checked
                  />
                  <span class="tag-label tag-ideas">
                    <i class="fas fa-lightbulb"></i> Ideas
                  </span>
                </label>
                <label class="tag-option">
                  <input
                    type="radio"
                    name="noteTag"
                    value="reminders"
                    class="tag-radio"
                  />
                  <span class="tag-label tag-reminders">
                    <i class="fas fa-bell"></i> Recordatorios
                  </span>
                </label>
              </div>
            </div>
            <button type="submit" class="submit-btn">Guardar Notapp's</button>
          </form>
        </div>
      </div>

      <div id="confirmModal" class="modal-overlay">
        <div class="modal confirmation-modal">
          <div class="modal-body">
            <p class="confirmation-text">
              Esta seguro que quiere eliminar este Notapp's?
            </p>
            <div class="confirmation-buttons">
              <button id="cancelDeleteBtn" class="confirmation-btn cancel-btn">
                Cancelar
              </button>
              <button
                id="confirmDeleteBtn"
                class="confirmation-btn confirm-btn"
              >
                Eliminar
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
